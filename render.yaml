services:
  - type: web
    name: leadforge
    runtime: node
    region: oregon
    plan: starter
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ PORT=3000 pnpm --filter @workspace/leadforge run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://leadforge.onrender.com

databases:
  - name: leadforge-db
    databaseName: leadforge
    user: leadforge_user
    plan: starter
